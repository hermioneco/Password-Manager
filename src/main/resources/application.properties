# ══════════════════════════════════════════════════════════════
# LockBox — Configuration Spring Boot / SQLite / JPA
#  Base de données / DevOps
# ══════════════════════════════════════════════════════════════

# ── SQLite DataSource ──────────────────────────────────────────
# Le fichier vault.db est stocké dans ~/.lockbox/ (créé au démarrage)
# La valeur est construite dynamiquement par DatabaseConfig.java
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.url=jdbc:sqlite:${user.home}/.lockbox/vault.db
spring.datasource.username=
spring.datasource.password=

# ── Hibernate / JPA ───────────────────────────────────────────
# Dialecte SQLite (hibernate-community-dialects)
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect

# create-drop : recrée le schéma à chaque démarrage (dev)
# update      : met à jour le schéma sans perte de données (prod)
spring.jpa.hibernate.ddl-auto=update

# Affiche le SQL généré par Hibernate (désactiver en prod)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Désactive l'auto-commit pour SQLite
spring.jpa.properties.hibernate.connection.autocommit=false

# ── Spring Boot ───────────────────────────────────────────────
# Désactive le serveur web embarqué (application desktop uniquement)
spring.main.web-application-type=none

# Permet au contexte Spring de démarrer dans un thread JavaFX
spring.main.lazy-initialization=true

# ── Logging ───────────────────────────────────────────────────
# Niveau INFO par défaut ; passer à DEBUG si besoin d'investiguer
logging.level.root=WARN
logging.level.com.lockbox=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework=WARN

# SÉCURITÉ : ne jamais logger les valeurs des paramètres (données sensibles)
logging.level.org.hibernate.orm.jdbc.bind=TRACE
